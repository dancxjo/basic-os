[package]
name = "init"
version = "0.1.0"
edition = "2021"

[dependencies]
userland = { path = "../../userland" }
thing_abi = { path = "../../thing_abi" }

[target.'cfg(target_os = "none")'.dependencies]
# compositor = { path = "../../compositor", optional = true }

[features]
default = []
std = ["userland/std"]

[lib]
name = "init"
path = "src/lib.rs"

[[bin]]
name = "init"
path = "src/main.rs"
