[package]
name = "compositor"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
userland = { path = "../userland" }
uuid = { version = "=1.10", default-features = false, features = [
  "v5",
  "serde",
] }
unifont = { version = "1.1.0+data-15.1.05", default-features = false }
thing_abi = { path = "../thing_abi" }
demo_app = { path = "../apps/demo_app", optional = true }
self_editing_demo = { path = "../apps/self_editing_demo", optional = true }
app-mouse-driver = { path = "../drivers/mouse_driver", optional = true }
app-keyboard-driver = { path = "../drivers/keyboard_driver", optional = true }
app-framebuffer-driver = { path = "../drivers/framebuffer_driver", optional = true }
thing_viewer = { path = "../apps/thing_viewer", optional = true }
text_editor = { path = "../apps/text_editor", optional = true }
rootfs = { path = "../apps/rootfs", optional = true }
graph_viewer = { path = "../apps/graph_viewer", optional = true }
init = { path = "../apps/init", optional = true }
widget_host = { path = "../widgets/host", optional = true }
widget_button = { path = "../widgets/button" }
x86_64 = { version = "0.14.11", default-features = false, features = [
  "instructions",
], optional = true }
spin = "0.9.8"

[target.'cfg(not(target_os = "none"))'.dependencies]
tiny_http = { version = "0.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.21"

[build-dependencies]
flate2 = "1.0"

[features]
kernel_standalone = [
  "app-mouse-driver/disable_panic_handler",
  "app-keyboard-driver/disable_panic_handler",
  "app-framebuffer-driver/disable_panic_handler",
  "graph_viewer/disable_panic_handler",
  "widget_host/disable_panic_handler",
  "x86_64",
  "userland/kernel_standalone",
  "userland/disable_panic_handler",
  "rootfs",
]
default = []
demo-apps = []
std = ["userland/std"]
host = [
  "tiny_http",
  "std",
  "demo_app/std",
  "self_editing_demo/std",
  "app-mouse-driver/std",
  "app-keyboard-driver/std",
  "app-framebuffer-driver/std",
  "thing_viewer/std",
  "init/std",
  "rootfs/std",
  "text_editor/std",
  "widget_host/std",
]

[[bin]]
name = "compositor"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[profile.release]
panic = "abort"
