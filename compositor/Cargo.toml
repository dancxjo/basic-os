[package]
name = "compositor"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
userland = { path = "../userland" }
uuid = { version = "=1.10", default-features = false, features = [
  "v5",
  "serde",
] }
unifont = { version = "1.1.0+data-15.1.05", default-features = false }
init = { path = "../apps/init", features = ["std"] }
demo_app = { path = "../apps/demo_app", features = ["std"] }
app-mouse-driver = { path = "../drivers/mouse_driver", features = ["std"] }
app-keyboard-driver = { path = "../drivers/keyboard_driver", features = ["std"] }
app-framebuffer-driver = { path = "../drivers/framebuffer_driver", features = ["std"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
tiny_http = { version = "0.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.21"

[build-dependencies]
flate2 = "1.0"

[features]
default = []
demo-apps = []
std = ["userland/std"]
host = ["tiny_http", "std"]

[[bin]]
name = "compositor"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[profile.release]
panic = "abort"
