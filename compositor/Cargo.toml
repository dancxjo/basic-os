[package]
name = "compositor"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
userland = { path = "../userland" }
uuid = { version = "=1.10", default-features = false, features = [
  "v5",
  "serde",
] }
thing_abi = { path = "../thing_abi" }
thing_host = { path = "../thing_host", optional = true }
demo_app = { path = "../apps/demo_app", optional = true }
self_editing_demo = { path = "../apps/self_editing_demo", optional = true }
mouse-driver = { path = "../drivers/mouse_driver", optional = true }
keyboard-driver = { path = "../drivers/keyboard_driver", optional = true }
framebuffer-driver = { path = "../drivers/framebuffer_driver", optional = true }
thing_viewer = { path = "../apps/thing_viewer", optional = true }
text_editor = { path = "../apps/text_editor", optional = true }
rootfs = { path = "../apps/rootfs", optional = true }
graph_viewer = { path = "../apps/graph_viewer", optional = true }
init = { path = "../apps/init", optional = true }
widget_host = { path = "../widgets/host", optional = true }
terminal = { path = "../apps/terminal", optional = true }
widget_button = { path = "../widgets/button" }
svg-path-cst = "0.1"
x86_64 = { version = "0.14.11", default-features = false, features = [
  "instructions",
], optional = true }
spin = "0.9.8"
fontdue = { version = "0.8", default-features = false }
xmlparser = { version = "0.13", default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
tiny_http = { version = "0.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.21"

[build-dependencies]
flate2 = "1.0"

[features]
kernel_standalone = [
  "mouse-driver/disable_panic_handler",
  "keyboard-driver/disable_panic_handler",
  "framebuffer-driver/disable_panic_handler",
  "graph_viewer/disable_panic_handler",
  "widget_host/disable_panic_handler",
  "x86_64",
  "userland/kernel_standalone",
  "userland/disable_panic_handler",
  "rootfs",
]
default = []
demo-apps = []
std = ["userland/std"]
host = [
  "tiny_http",
  "std",
  "userland/std",
  "thing_host",
  "thing_host/neo4j",
  "demo_app/std",
  "self_editing_demo/std",
  "mouse-driver/std",
  "keyboard-driver/std",
  "framebuffer-driver/std",
  "thing_viewer/std",
  "init/std",
  "rootfs/std",
  "text_editor/std",
  "graph_viewer/std",
  "widget_host/std",
  "terminal/std",
]

[[bin]]
name = "compositor"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
