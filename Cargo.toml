[workspace]
members = [
    "thing_abi",
    "thing_host",
    "kernel",
    "userland",
    "compositor",
    "apps/*",
    "drivers/*",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.226", default-features = false, features = ["derive", "alloc"] }
serde_derive = { version = "=1.0.226" }
