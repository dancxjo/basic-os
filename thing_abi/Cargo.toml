[package]
name = "thing_abi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shared ThingOS ABI definitions for kernel and userland"

[dependencies]
serde = { workspace = true }
uuid = { version = "=1.10", default-features = false, features = ["serde", "v5"] }

[dev-dependencies]
postcard = { version = "1.0.4", default-features = false, features = ["alloc"] }
