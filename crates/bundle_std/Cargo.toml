[package]
name = "thingos_bundle_std"
version = "0.1.0"
edition = "2021"

[dependencies]
thing_abi = { path = "../../thing_abi" }
thingos_kernel_std = { path = "../../crates/kernel_std" }
userland = { path = "../../userland" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0.4", default-features = false, features = ["alloc"] }
uuid = { version = "1.10", default-features = false, features = ["serde"] }

linked_list_allocator = "0.10"

[features]
default = []
host = ["userland/std"]
