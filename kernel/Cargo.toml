[package]
name = "thingos"
version = "0.1.0"
edition = "2024"

[dependencies]
limine = "0.4"
linked_list_allocator = "0.10"
spin = "0.10.0"
x86_64 = { version = "0.14.11", default-features = false, features = [
    "instructions",
    "abi_x86_interrupt",
] }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
postcard = { version = "1.0.4", default-features = false, features = ["alloc"] }
thing_macros = { path = "../thing_macros" }
uuid = { version = "1.16.0", default-features = false, features = [] }
sha2 = { version = "0.10.8", default-features = false, features = [
    "force-soft",
] }
wasmi = { version = "0.44.0", default-features = false, features = ["simd"] }

[features]
default = []

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
