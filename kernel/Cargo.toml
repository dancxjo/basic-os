[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
thingos_kernel_std = { path = "../crates/kernel_std" }
limine = "0.5"
linked_list_allocator = "0.10"
spin = "0.10.0"
serde = { workspace = true }
postcard = { version = "1.0.4", default-features = false, features = ["alloc"] }
libm = "0.2.11"
embedded-graphics = "0.8.1"
ps2-mouse = "0.1.4"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
spinning_top = "0.3.0"
pic8259 = "0.11.0"
log = { version = "0.4", default-features = false }
heapless = "0.8.0"
x86_64 = { version = "0.14.11", default-features = false, features = [
    "instructions",
    "abi_x86_interrupt",
] }
anyhow = { version = "1.0.98", default-features = false }
goblin = { version = "0.10.0", default-features = false, features = [
    "alloc",
    "log",
    "elf64",
    "elf32",
    "endian_fd",
] }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
uuid = { version = "=1.10", default-features = false, features = [
    "v5",
    "serde",
] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
thing_abi = { path = "../thing_abi" }
compositor = { path = "../compositor", optional = true, default-features = false, features = [
    "kernel_standalone",
] }
init = { path = "../apps/init", optional = true, default-features = false, features = [
    "kernel_standalone",
] }

[features]
# Default: simplest, safest mode
default = ["standalone_compositor"]

# Enable standalone compositor (cooperative single-process mode)
standalone_compositor = ["compositor", "init"]

# Enable preemptive multitasking: scheduler, timer-driven context switching, user tasks
kernel_multitask = []

# Enable advanced MM: pools, page-table region, etc.
mm_advanced = []

# Existing toggles
apic = []
debug_heap_bump = []
debug_frame_sanity = []
debug_heap_canaries = []
debug_task_context = []

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[build-dependencies]
cc = "1.0"

[package.metadata.cargo-xbuild]
target = "x86_64-unknown-none"

[build]
rustflags = ["-C", "target-cpu=x86-64"]
