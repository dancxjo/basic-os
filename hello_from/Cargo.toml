[package]
name = "hello_from"
version = "0.1.0"
edition = "2021"

[dependencies]

[profile.release]
panic = "abort"

[build]
target = "x86_64-unknown-none"

[[bin]]
name = "hello_from"
path = "src/main.rs"

[unstable]
build-std = ["core"]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Ttext=0x400000",  # Set text segment address
]