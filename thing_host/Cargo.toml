[package]
name = "thing_host"
version = "0.1.0"
edition = "2021"

[dependencies]
thing_abi = { path = "../thing_abi" }
serde = { workspace = true }
uuid = { version = "=1.10", default-features = false, features = [
    "v5",
    "serde",
] }
parking_lot = "0.12"

anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
neo4rs = { version = "0.8", optional = true }
serde_json = "1.0"
futures = "0.3"

[features]
neo4j = ["dep:neo4rs"]
